<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess It</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" href="/partials/header.html" as="fetch" crossorigin>
  <script src="script.js" defer></script>
  <script src="../partials/include.js" defer></script>
  <script src="../partials/construction.js" defer></script>
</head>

<body data-nav="games" data-project-name="Guess It" data-project-icon="❓" data-status="construction" data-progress="75">

  <div id="site-header"></div>
  <main class="guess-it-app">

    <h1>Number guessing game</h1>
    <p>
      We have selected a random number between 1 and 100. See if you can guess
      it in 10 turns or fewer. We'll tell you if your guess was too high or too
      low.
    </p>

    <div class="form">
      <label for="guessField">Enter a guess: </label>
      <input type="number" min="1" max="100" required id="guessField" class="guessField" />
      <input type="submit" value="Submit guess" class="guessSubmit" />
    </div>

    <div class="resultParas">
      <p class="guesses"></p>
      <p class="lastResult"></p>
      <p class="lowOrHi"></p>
    </div>
  </main>
  <div id="footer-container"></div>
</body>

</html>
