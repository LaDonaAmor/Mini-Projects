<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme-preference") || "light");</script>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" href="/partials/header.html" as="fetch" crossorigin>
  <script src="script.js" defer></script>
  <script src="../partials/include.js" defer></script>
  <script src="/partials/theme.js"></script>
</head>

<body data-nav="utilities" data-project-name="Calculator" data-project-icon="🧮">
  <div id="site-header"></div>



  <div id="calculator">
    <input type="text" class="display" disabled />
    <div class="buttons">
      <button class="clear_entry">CE</button>
      <button class="clear">C</button>
      <button class="delete">DEL</button>
      <button class="operator">÷</button>
      <button class="numbers">9</button>
      <button class="numbers">8</button>
      <button class="numbers">7</button>
      <button class="operator">×</button>
      <button class="numbers">6</button>
      <button class="numbers">5</button>
      <button class="numbers">4</button>
      <button class="operator">-</button>
      <button class="numbers">3</button>
      <button class="numbers">2</button>
      <button class="numbers">1</button>
      <button class="operator">+</button>
      <button class="decimal">.</button>
      <button class="numbers">0</button>
      <button class="percent">%</button>
      <button class="equal">=</button>
    </div>
  </div>
  <div id="footer-container"></div>
</body>

</html>
