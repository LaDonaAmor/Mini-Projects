<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Projects Hub</title>

  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preload" href="/partials/header.part" as="fetch" crossorigin>

  <script src="/partials/include.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body data-nav="hub">
  <div id="site-header"></div>

  <div class="container">
    <span class="welcome-badge">PIXELS & LOGIC</span>
    <h1>A fun corner of the web!</h1>
    <p>
      Discover handcrafted mini tools, games, and experiments built with HTML, CSS,
      and JavaScript. No sign-ups, no clutter, just simple, interactive experiences. Pick a project, explore, and have
      fun.
    </p>

    <div class="search-container">
      <span class="search-label">SEARCH PROJECTS</span>
      <div class="search-wrapper">
        <input type="text" id="search-input" placeholder="Type to search..." />
        <span class="search-icon">🔍</span>
      </div>
    </div>

    <div class="project-grid" id="project-grid-container">
      <!-- JavaScript will inject cards here automatically -->
    </div>

  </div>
  <div id="footer-container"></div>
</body>

</html>
